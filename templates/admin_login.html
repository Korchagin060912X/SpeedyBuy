{% extends 'base.html' %}

{% block title %}SpeedyBuy — админ-панель{% endblock %}

{% block content %}
<section class="checkout-layout">
    <div class="checkout-form">
        <h2>Админ-панель</h2>
        <p>Только Администратор может зайти в этот отдел!</p>
        <p>Войдите под администратором, чтобы продолжить.</p>

        <form method="post" action="{{ url_for('admin_panel') }}">
            <label>
                Логин
                <input type="text" name="username" autocomplete="username" required>
            </label>
            <label>
                Пароль
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="primary-btn">Войти в админку</button>
        </form>
    </div>
</section>
{% endblock %}
